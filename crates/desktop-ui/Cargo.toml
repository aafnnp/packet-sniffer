[package]
name = "desktop-ui"
description = "基于 NSH 的原生图形界面：Proxyman 风格的抓包工作台"
edition = "2024"
version.workspace = true
license.workspace = true

[lib]
name = "desktop_ui"
path = "src/lib.rs"

[[bin]]
name = "packet-sniffer-ui"
path = "src/main.rs"

[dependencies]
desktop = { path = "../desktop" }
common = { path = "../common" }
proxy-engine = { path = "../proxy-engine" }
system-bridge = { path = "../system-bridge" }

nsh-core.workspace = true
nsh-base.workspace = true
env_logger = "0.11"

tokio.workspace = true
async-channel.workspace = true
chrono.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
