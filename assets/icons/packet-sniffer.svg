<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Packet Sniffer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.55" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#glow)"/>
  <rect x="74" y="74" width="876" height="876" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- 三条数据包，表示被检查的请求 / 响应流 -->
  <rect x="190" y="296" width="392" height="78" rx="39" fill="url(#packet)" opacity="0.95"/>
  <rect x="190" y="444" width="486" height="78" rx="39" fill="url(#packet)" opacity="0.8"/>
  <rect x="190" y="592" width="320" height="78" rx="39" fill="url(#packet)" opacity="0.6"/>

  <!-- 放大镜：抓包后的检视 -->
  <circle cx="600" cy="540" r="240" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="600" cy="540" r="240" fill="none" stroke="#ffffff" stroke-width="66"/>
  <line x1="776" y1="716" x2="848" y2="788" stroke="#ffffff" stroke-width="92" stroke-linecap="round"/>
</svg>
